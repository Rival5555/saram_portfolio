<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#F5F3ED" />
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#DCD9D0" stroke-width="2" />
  <!-- Minimalist Swiss monogram / coordinate intersection -->
  <line x1="16" y1="32" x2="48" y2="32" stroke="#294C3B" stroke-width="3" stroke-linecap="round" />
  <line x1="32" y1="16" x2="32" y2="48" stroke="#294C3B" stroke-width="3" stroke-linecap="round" />
  <!-- Central node -->
  <circle cx="32" cy="32" r="5" fill="#294C3B" />
  <!-- 4 satellite data points -->
  <circle cx="20" cy="20" r="2.5" fill="#171916" />
  <circle cx="44" cy="20" r="2.5" fill="#77786F" />
  <circle cx="20" cy="44" r="2.5" fill="#77786F" />
  <circle cx="44" cy="44" r="2.5" fill="#171916" />
</svg>